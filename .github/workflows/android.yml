name: Android APK

# Builds an installable APK and attaches it to the workflow run, so it can be
# downloaded from the repository without anyone needing Android Studio.
# Push a tag like v0.1.0 and it also becomes a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The Capacitor CLI refuses to run on anything below 22.
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the obsolete `tools`
          # package, which no longer exists in the SDK repository and fails the
          # whole step. Everything else Gradle needs it downloads itself.
          packages: platform-tools

      - run: npm ci

      # The APK must work with no network at all, so every dataset is fetched
      # and baked into the bundle here — including the 74 MB hadith corpus that
      # is deliberately not in git.
      - name: Fetch all data
        run: npm run data:all

      - name: Tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor
        run: |
          npx cap sync android
          node scripts/android-setup.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          # Committed from Windows, so the executable bit can be lost.
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          SRC=$(find android -name "*-debug.apk" | head -1)
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          DEST="sabeel-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$DEST" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "Built $DEST ($(du -h "$DEST" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: sabeel-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      # A workflow artifact can only be fetched by someone signed in who knows to
      # go digging through Actions, and it expires. A release gives the build a
      # permanent, direct download link instead. One rolling release is kept
      # pointing at the newest build, under a stable filename, so the link in the
      # README never has to change:
      #
      #   https://github.com/<owner>/<repo>/releases/latest/download/sabeel.apk
      - name: Publish the latest build
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          SIZE: ${{ steps.apk.outputs.size }}
        run: |
          cp "${{ steps.apk.outputs.path }}" sabeel.apk

          # A quoted heredoc, so nothing inside is expanded by the shell except
          # what is deliberately substituted below. Building this with printf and
          # backslash continuations is what broke the file last time.
          cat > notes.md <<'NOTES'
          Newest build of Sabeel, from COMMIT on BUILD_DATE.

          **[Download sabeel.apk](https://github.com/REPO/releases/latest/download/sabeel.apk)** — SIZE_HERE

          Open it on your Android phone. The first time, Android will ask you to
          allow installing from your browser or file manager, because this does
          not come from the Play Store.

          Everything is in the app already: the Quran with the 604-page muṣḥaf
          layout, all 36,512 hadith, the duas, prayer calculation, the adhans and
          the fonts. Only recitation streams, and whatever you play is kept on
          the device.

          Debug-signed, so Android will call the developer unknown. That is
          expected until the project has a release keystore.
          NOTES

          sed -i "s|COMMIT|${GITHUB_SHA::7}|; s|BUILD_DATE|$(date -u '+%d %B %Y')|; s|REPO|${GITHUB_REPOSITORY}|; s|SIZE_HERE|${SIZE}|" notes.md

          # Update in place when the release already exists. Deleting and
          # recreating it would churn the tag, briefly 404 a download link
          # someone may have bookmarked, and reset the download count.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest sabeel.apk --clobber
            gh release edit latest --notes-file notes.md --prerelease
          else
            gh release create latest sabeel.apk \
              --title "Latest build" \
              --notes-file notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          body: |
            **Sabeel ${{ github.ref_name }}** — Quran, Hadith, Prayer and Dua.

            Download the `.apk` below and open it on your Android phone. You will
            need to allow installing from your browser or file manager the first
            time, because this is not distributed through the Play Store.

            This build is **fully offline**: the Quran, all 36,512 hadith, duas,
            prayer calculation, fonts and the adhan are inside the app. Only
            recitation streams, and anything you play is kept on the device.

            APK size: ${{ steps.apk.outputs.size }}. Debug-signed — Android will
            warn that it is from an unknown developer, which is expected until
            the project has a release keystore.
