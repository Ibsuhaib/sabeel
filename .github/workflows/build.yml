name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The hadith corpus is not in git. CI rebuilds it from source on every run,
      # which also means a broken upstream dataset fails here and not in production.
      - name: Fetch data
        run: npm run data:all

      - name: Build
        run: npm run build

      - name: Report bundle size
        run: du -sh dist && du -sh dist/assets
