name: Play Store bundle

# Builds the signed Android App Bundle that Google Play accepts. Play has not
# taken APKs for new apps since 2021 — it wants an .aab and serves each device a
# slice of it — so this is a separate workflow from the APK one, which exists so
# people can sideload.
#
# It only runs when asked, and only signs when the secrets are present: without
# them it still builds, so that a broken release build is caught here rather
# than on the day you try to publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name people will see, e.g. 1.0.0'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is the commit count, so the whole history has to be here
          # or every build would claim to be version 1.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: npm ci

      - name: Set the version name
        run: echo "${{ inputs.version }}" > VERSION

      - name: Fetch all data
        run: npm run data:all

      - name: Tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor
        run: |
          npx cap sync android
          node scripts/android-setup.mjs

      # The keystore is held as a base64 secret. Anything written here lives only
      # for the life of the runner.
      - name: Restore the upload key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secret set — building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the bundle
        working-directory: android
        env:
          SABEEL_KEYSTORE: ${{ runner.temp }}/upload.jks
          SABEEL_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SABEEL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SABEEL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Name it
        id: aab
        run: |
          SRC=$(find android -name "*-release.aab" | head -1)
          CODE=$(git rev-list --count HEAD)
          DEST="sabeel-${{ inputs.version }}-${CODE}.aab"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Built $DEST ($(du -h "$DEST" | cut -f1)) · versionCode $CODE"
          echo "signed: ${{ steps.signing.outputs.signed }}"

      - uses: actions/upload-artifact@v4
        with:
          name: sabeel-aab
          path: ${{ steps.aab.outputs.path }}
          retention-days: 90
